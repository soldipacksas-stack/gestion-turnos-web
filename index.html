<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión de turnos</title><style>body{margin:0;font:15px system-ui;background:#f1f5f9;color:#193044}header{background:#142d42;color:white;padding:20px}header h2{margin:0}nav{display:flex;gap:8px;flex-wrap:wrap;padding:14px;background:white}main{padding:18px}button,input,select{font:inherit;padding:8px;border:1px solid #cbd5e1;border-radius:6px}button:disabled{opacity:.6;cursor:wait}button{cursor:pointer;background:#164b65;color:white}input,select{background:white;color:#193044}section{background:white;padding:16px;border-radius:10px;margin-bottom:12px}.scroll{overflow:auto;max-height:70vh}table{border-collapse:separate;border-spacing:2px;white-space:nowrap}td,th{padding:8px;text-align:center}th{position:sticky;top:0;background:#e2e8f0;z-index:2}td:first-child,th:first-child{position:sticky;left:0;background:white;text-align:left;z-index:1}th:first-child{z-index:3}.T1{background:#dceeff}.T2{background:#fff0bf}.T3{background:#d6efdf}.DESC{background:#e5e7eb}.bad{color:#b91c1c}.coverage-bad{background:#fee2e2;color:#991b1b;font-weight:bold}.coverage-empty{color:#64748b}button:disabled{cursor:not-allowed}.good{color:#166534}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}pre{white-space:pre-wrap}label{display:inline-block;margin:5px}canvas{max-width:100%}th.holiday{background:#ffe2e2;color:#b00020}th.holiday:after{content:" ★";font-size:10px}.month-title{margin:0 0 12px;font-size:21px;font-weight:700;text-transform:uppercase;color:#142d42;position:sticky;left:0; width:max-content;max-width:100%;white-space:normal}</style><header><h2>Gestión y programación de turnos</h2>Sistema de programación operacional</header><nav id="nav"></nav><main id="main"></main><script>
let generating=false;let S,tab='Programación';const M=document.querySelector('#main'),N=document.querySelector('#nav');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,p){let r=await fetch(url,p===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});let j;try{j=await r.json()}catch(e){throw Error(`Respuesta del servidor: HTTP ${r.status}`)}if(!r.ok)throw Error(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail));return j}async function act(a,p){try{await api('/action/'+a,p);await load()}catch(e){alert(e.message)}}async function generateDraft(){if(generating)return;const a=document.querySelector('#start').value,b=document.querySelector('#end').value;if(!a||!b||a>b)return alert('Fechas inválidas');generating=true;const btn=document.querySelector('#generateBtn'),msg=document.querySelector('#generateStatus');btn.disabled=true;btn.textContent='Generando programación…';msg.textContent='Evaluando cobertura, descansos y rotación. Espere la respuesta del servidor.';try{await api('/action/generate',{start:a,end:b});selected=a.slice(0,7);await load()}catch(e){alert(e.message)}finally{generating=false;const current=document.querySelector('#generateBtn');if(current){current.disabled=false;current.textContent='Generar borrador'}const status=document.querySelector('#generateStatus');if(status)status.textContent=''}}async function load(){try{S=await api('/data');render()}catch(e){N.innerHTML='';M.innerHTML='<section><h3>Acceso</h3><select id="role"><option value="operator">Operadores</option><option value="admin">Administrador</option></select> <input id="pw" type="password" placeholder="Clave"> <button onclick="login()">Ingresar</button></section>'}}async function login(){try{await api('/login',{role:role.value,password:pw.value});load()}catch(e){alert(e.message)}}function go(t){tab=t;render()}function iso(d){return d.toISOString().slice(0,10)}function dates(a,b){let out=[];for(let d=new Date(a+'T00:00:00Z');iso(d)<=b;d.setUTCDate(d.getUTCDate()+1))out.push(iso(d));return out}function month(){return new Date().toISOString().slice(0,7)}let selected=month();function monthEnd(m){return m+'-'+new Date(Date.UTC(+m.slice(0,4),+m.slice(5),0)).getUTCDate()}function hours(w){let total=w.reduce((sum,t)=>{if(!/^T[123]$/.test(t||''))return sum;let [a,b]=S.config.shifts[+t[1]-1].map(v=>{let [h,m]=v.split(':').map(Number);return h*60+m});return sum+((b-a+1440)%1440||1440)},0);return Math.floor(total/60)+' h '+String(total%60).padStart(2,'0')+' min'}function render(){let admin=S.role==='admin';N.innerHTML=(admin?['Dashboard','Programación','Operadores','Novedades','Cambios de turno','Historial','Reportes','Configuración']:['Programación']).map(t=>`<button onclick="go('${t}')">${t}</button>`).join('')+'<button onclick="api(\'/logout\',{}).then(load)">Salir</button>';if(!admin)tab='Programación';if(tab==='Programación'||tab==='Cambios de turno'){let d=S.draft;M.innerHTML=`<section><h3>${tab}</h3>${admin?`<div class="tools"><input type="date" id="start" value="${d?esc(d.start):selected+'-01'}"><input type="date" id="end" value="${d?esc(d.end):monthEnd(selected)}"><button id="generateBtn" onclick="generateDraft()" ${generating?'disabled':''}>${generating?'Generando programación…':'Generar borrador'}</button><span id="generateStatus" role="status" aria-live="polite">${generating?'Evaluando programación…':''}</span>${d?`<button onclick="act('publish',{})" ${generating||S.errors.length?'disabled':''}>Publicar</button><button onclick="if(confirm('Eliminar borrador?'))act('delete_draft',{})">Eliminar borrador</button>`:''}</div>`:''}<p>${d?'Borrador — no visible para operadores · '+esc(d.start)+' a '+esc(d.end):'Programación publicada'}</p><input type="month" value="${selected}" onchange="selected=this.value;render()"> <span>T1 · T2 · T3 · DESC · ★ Festivo</span></section>`;if(d&&S.errors.length)M.innerHTML+=`<section class="bad"><b>${S.errors.length} incumplimientos</b><p>Revise cobertura, descansos o intercambie asignaciones antes de publicar.</p>${S.errors.slice(0,100).map(esc).join('<br>')}</section>`;let last=new Date(Date.UTC(+selected.slice(0,4),+selected.slice(5),0)).getUTCDate();M.innerHTML+=sheet(d?d.rows:S.published,dates(selected+'-01',selected+'-'+last),!!d&&admin,selected);return}if(tab==='Operadores'){renderOps();return}if(tab==='Novedades'){M.innerHTML=`<section><h3>Novedades</h3><select id="op">${S.operators.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`)}</select><select id="type">${['VAC','INC','PER','LIC','CAP','AUS'].map(t=>`<option>${t}</option>`)}</select><input type="date" id="a"><input type="date" id="b"><input id="obs" placeholder="Observación opcional"><button onclick="addNov()">Agregar</button>${S.novelties.map((n,i)=>`<p>${esc(S.operators.find(o=>o.id===n.operator)?.name)} · ${esc(n.type)} · ${esc(n.start)} a ${esc(n.end)} <button onclick="if(confirm('Eliminar?')){S.novelties.splice(${i},1);act('novelties',{items:S.novelties})}">Eliminar</button></p>`).join('')}</section>`;return}if(tab==='Configuración'){M.innerHTML='<section><h3>Configuración</h3>'+Object.entries(S.config).filter(([k,v])=>typeof v==='number').map(([k,v])=>`<label>${esc(({coverage:'Cobertura',rest:'Descansos semanales',gap:'Horas mínimas entre turnos',maxrun:'Días consecutivos',alerts:'Anticipación de alertas'})[k])} <input type="number" min="1" value="${v}" onchange="S.config['${k}']=+this.value"></label>`).join('')+S.config.shifts.map((t,i)=>`<p>T${i+1} ${t.map((v,j)=>`<input type="time" value="${v}" onchange="S.config.shifts[${i}][${j}]=this.value">`).join(' ')}</p>`).join('')+'<button onclick="act(\'config\',S.config)">Guardar</button></section>';return}if(tab==='Historial'){M.innerHTML='<section><h3>Versiones publicadas</h3>'+S.versions.map((v,i)=>`<p>${esc(v.start)} – ${esc(v.end)} · ${esc(v.published_at)} <button onclick="showVersion(${i})">Consultar</button></p>`).join('')+'</section><div id="version"></div>';return}let rows=S.published;M.innerHTML=`<section><h3>${tab}</h3><p>Operadores activos: ${S.operators.filter(o=>o.active).length} · Versiones: ${S.versions.length}</p><input type="month" value="${selected}" onchange="selected=this.value;render()"></section>`;let ds=dates(selected+'-01',selected+'-'+new Date(Date.UTC(+selected.slice(0,4),+selected.slice(5),0)).getUTCDate());M.innerHTML+='<section><table><tr><th>Operador</th><th>T1</th><th>T2</th><th>T3</th><th>DESC</th><th>Horas</th><th>Domingos libres</th></tr>'+S.operators.map(o=>{let r=rows[o.id]||{},v=ds.map(d=>r[d]);let n=['T1','T2','T3','DESC'].map(t=>v.filter(x=>x===t).length);return `<tr><td>${esc(o.name)}</td>${n.map(x=>`<td>${x}</td>`).join('')}<td>${8.5*(n[0]+n[1]+n[2])}</td><td>${ds.filter(d=>new Date(d).getUTCDay()===0&&r[d]==='DESC').length}</td></tr>`}).join('')+'</table></section>'+sheet(rows,ds,false)}function localToday(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Bogota',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function renderOps(){M.innerHTML=`<section><h3>Gestión de operadores</h3><div class="tools"><b>Total: ${S.operators.length}</b> · <span class="good">Activos: ${S.operators.filter(o=>o.active).length}</span> · Inactivos: ${S.operators.filter(o=>!o.active).length}<input id="opsearch" placeholder="Buscar operador" oninput="filterOps()"><button onclick="opForm('new')">+ Nuevo operador</button></div></section><div id="opform"></div><div id="opgroups"></div>`;filterOps()}
function filterOps(){let q=document.querySelector('#opsearch').value.toLowerCase();document.querySelector('#opgroups').innerHTML=[0,1,2].map(g=>{let all=S.operators.filter(o=>o.group===g),items=all.filter(o=>o.name.toLowerCase().includes(q)||(o.code||'').toLowerCase().includes(q));return `<section><h3 style="background:#142d42;color:white;padding:12px;border-radius:5px">Grupo ${g+1} · ${all.length} operadores</h3><div style="overflow:auto"><table style="width:100%"><tr><th>Nombre</th><th>Código</th><th>Estado</th><th>Acciones</th></tr>${items.map(o=>`<tr><td>${esc(o.name)}</td><td>${esc(o.code||'—')}</td><td class="${o.active?'good':'bad'}">${o.active?'Activo':'Inactivo'}</td><td><button onclick="opForm('edit',${o.id})">Modificar</button> <button onclick="opForm('transfer',${o.id})">Trasladar</button> <button onclick="opForm('${o.active?'inactive':'active'}',${o.id})">${o.active?'Inactivar':'Reactivar'}</button> <button onclick="opHistory(${o.id})">Historial</button></td></tr>`).join('')}</table></div></section>`}).join('')}
function opForm(kind,id){let o=S.operators.find(x=>x.id===id)||{},f=document.querySelector('#opform');f.innerHTML=`<section><h3>${({new:'Nuevo operador',edit:'Modificar',transfer:'Trasladar',inactive:'Inactivar',active:'Reactivar'})[kind]}</h3>${kind==='new'||kind==='edit'?`<label>Nombre <input id="oname" value="${esc(o.name||'')}"></label><label>Código opcional <input id="ocode" value="${esc(o.code||'')}"></label>`:esc(o.name)}${kind==='new'||kind==='transfer'?`<label>Grupo <select id="ogroup">${[0,1,2].map(g=>`<option value="${g}" ${o.group===g?'selected':''}>G${g+1}</option>`).join('')}</select></label>`:''}${kind!=='edit'?`<label>Fecha de vigencia <input id="odate" type="date" value="${localToday()}"></label>`:''}<button onclick="saveOp('${kind}',${id||0})">Guardar</button> <button onclick="document.querySelector('#opform').innerHTML=''">Cancelar</button></section>`;f.scrollIntoView({block:'nearest'})}
async function saveOp(kind,id){let get=k=>document.querySelector('#'+k)?.value;let p={kind,id,name:get('oname'),code:get('ocode'),group:Number(get('ogroup')),date:get('odate')};if(kind==='inactive'&&!confirm('¿Inactivar operador? Revise la cobertura futura.'))return;try{await api('/action/operator',p);await load();if(kind!=='edit')alert('Movimiento guardado. Revise o regenere el borrador si corresponde.')}catch(e){alert(e.message)}}
function opHistory(id){let o=S.operators.find(x=>x.id===id);document.querySelector('#opform').innerHTML=`<section><h3>Historial · ${esc(o.name)}</h3><p>Ingreso: ${esc(o.entry||'No registrado')}</p>${(o.events||[]).map(e=>`<p>${esc(e.date)} · ${esc(({transfer:'Traslado',active:'Reactivación',inactive:'Inactivación'})[e.kind])} ${e.changes.group!==undefined?' a G'+(e.changes.group+1):''}</p>`).join('')||'<p>Sin movimientos registrados.</p>'}<button onclick="document.querySelector('#opform').innerHTML=''">Cerrar</button></section>`}
function showVersion(i){let v=S.versions[i];document.querySelector('#version').innerHTML=sheet(v.rows,dates(v.start,v.end),false)}function addNov(){if(!a.value||!b.value||a.value>b.value)return alert('Fechas inválidas');S.novelties.push({operator:+op.value,type:type.value,start:a.value,end:b.value,obs:obs.value});act('novelties',{items:S.novelties})}const holidayCache={};function holidays(y){if(holidayCache[y])return holidayCache[y];let h={};const date=(m,d)=>new Date(Date.UTC(y,m-1,d));const add=(d,n)=>new Date(d.getTime()+n*86400000);const monday=d=>add(d,(8-d.getUTCDay())%7);const put=(d,n)=>h[iso(d)]=h[iso(d)]?h[iso(d)]+' / '+n:n;[[1,1,'Año Nuevo'],[5,1,'Día del Trabajo'],[7,20,'Independencia de Colombia'],[8,7,'Batalla de Boyacá'],[12,8,'Inmaculada Concepción'],[12,25,'Navidad']].forEach(([m,d,n])=>put(date(m,d),n));[[1,6,'Reyes Magos'],[3,19,'San José'],[6,29,'San Pedro y San Pablo'],[8,15,'Asunción de la Virgen'],[10,12,'Día de la Diversidad Étnica y Cultural'],[11,1,'Todos los Santos'],[11,11,'Independencia de Cartagena']].forEach(([m,d,n])=>put(monday(date(m,d)),n));let a=y%19,b=Math.floor(y/100),c=y%100,e=Math.floor(b/4),f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),q=(19*a+b-e-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*(b%4)+2*i-q-k)%7,z=Math.floor((a+11*q+22*l)/451),v=q+l-7*z+114;let easter=date(Math.floor(v/31),v%31+1);[[-3,'Jueves Santo'],[-2,'Viernes Santo'],[43,'Ascensión del Señor'],[64,'Corpus Christi'],[71,'Sagrado Corazón']].forEach(([n,label])=>put(add(easter,n),label));return holidayCache[y]=h}function holiday(d){return holidays(+d.slice(0,4))[d]||''}function sheet(rows,ds,edit,month){let heading=month?new Intl.DateTimeFormat('es-CO',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(month+'-01T00:00:00Z')):'';let h='<section class="scroll">'+(heading?`<h2 class="month-title">${esc(heading)}</h2>`:'')+'<table><tr><th>Operador</th>';for(let d of ds){h+=`<th class="${holiday(d)?'bad holiday':new Date(d).getUTCDay()===0?'bad':''}" title="${esc(holiday(d)|| (new Date(d).getUTCDay()===0?'Domingo':''))}">${d.slice(8)}<br>${['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][new Date(d).getUTCDay()]}</th>`;if(new Date(d).getUTCDay()===0)h+='<th>Horas</th>'}h+='</tr>';for(let o of S.operators){let r=rows[o.id]||{};h+=`<tr><td>${esc(o.name)} · G${o.group+1}</td>`;for(let d of ds){let t=r[d]||'';h+=`<td class="${esc(t)}" ${edit&&t?`onclick="cell(${o.id},'${d}','${t}')" style="cursor:pointer"`:''}>${esc(t||'—')}</td>`;if(new Date(d).getUTCDay()===0){let start=new Date(d);start.setUTCDate(start.getUTCDate()-6);let w=dates(iso(start),d).map(k=>r[k]);h+=`<td><b>${w.some(x=>!x)?'—':hours(w)}</b></td>`}}h+='</tr>'}for(let t of ['T1','T2','T3']){h+=`<tr><td>Cobertura ${t}</td>`;for(let d of ds){let entries=Object.values(rows);let has=entries.some(r=>r[d]);let n=entries.filter(r=>r[d]===t).length;h+=`<td class="${!has?'coverage-empty':n<S.config.coverage?'coverage-bad':'good'}">${has?n:'—'}</td>`;if(new Date(d).getUTCDay()===0)h+='<td></td>'}h+='</tr>'}return h+'</table></section>'}function cell(operator,date,old){let value=prompt('T1, T2, T3, DESC, VAC, INC, PER, LIC, CAP, AUS',old);if(value)act('edit',{operator,date,value:value.toUpperCase()})}load();</script></html>
