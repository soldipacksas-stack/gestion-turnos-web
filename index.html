<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión de turnos</title><style>body{margin:0;font:15px system-ui;background:#f1f5f9;color:#193044}header{background:#142d42;color:white;padding:20px}header h2{margin:0}nav{display:flex;gap:8px;flex-wrap:wrap;padding:14px;background:white}main{padding:18px}button,input,select{font:inherit;padding:8px;border:1px solid #cbd5e1;border-radius:6px}button:disabled{opacity:.6;cursor:wait}button{cursor:pointer;background:#164b65;color:white}input,select{background:white;color:#193044}section{background:white;padding:16px;border-radius:10px;margin-bottom:12px}.scroll{overflow:auto;max-height:70vh}table{border-collapse:separate;border-spacing:2px;white-space:nowrap}td,th{padding:8px;text-align:center}th{position:sticky;top:0;background:#e2e8f0;z-index:2}td:first-child,th:first-child{position:sticky;left:0;background:white;text-align:left;z-index:1}th:first-child{z-index:3}.T1{background:#dceeff}.T2{background:#fff0bf}.T3{background:#d6efdf}.DESC{background:#e5e7eb}.bad{color:#b91c1c}.good{color:#166534}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}pre{white-space:pre-wrap}label{display:inline-block;margin:5px}canvas{max-width:100%}</style><header><h2>Gestión y programación de turnos</h2>Sistema de programación operacional</header><nav id="nav"></nav><main id="main"></main><script>
let generating=false;let S,tab='Programación';const M=document.querySelector('#main'),N=document.querySelector('#nav');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,p){let r=await fetch(url,p===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});let j;try{j=await r.json()}catch(e){throw Error(`Respuesta del servidor: HTTP ${r.status}`)}if(!r.ok)throw Error(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail));return j}async function act(a,p){try{await api('/action/'+a,p);await load()}catch(e){alert(e.message)}}async function generateDraft(){if(generating)return;const a=document.querySelector('#start').value,b=document.querySelector('#end').value;if(!a||!b||a>b)return alert('Fechas inválidas');generating=true;const btn=document.querySelector('#generateBtn'),msg=document.querySelector('#generateStatus');btn.disabled=true;btn.textContent='Generando programación…';msg.textContent='Evaluando cobertura, descansos y rotación. Espere la respuesta del servidor.';try{await api('/action/generate',{start:a,end:b});selected=a.slice(0,7);await load()}catch(e){alert(e.message)}finally{generating=false;const current=document.querySelector('#generateBtn');if(current){current.disabled=false;current.textContent='Generar borrador'}const status=document.querySelector('#generateStatus');if(status)status.textContent=''}}async function load(){try{S=await api('/data');render()}catch(e){N.innerHTML='';M.innerHTML='<section><h3>Acceso</h3><select id="role"><option value="operator">Operadores</option><option value="admin">Administrador</option></select> <input id="pw" type="password" placeholder="Clave"> <button onclick="login()">Ingresar</button></section>'}}async function login(){try{await api('/login',{role:role.value,password:pw.value});load()}catch(e){alert(e.message)}}function go(t){tab=t;render()}function iso(d){return d.toISOString().slice(0,10)}function dates(a,b){let out=[];for(let d=new Date(a+'T00:00:00Z');iso(d)<=b;d.setUTCDate(d.getUTCDate()+1))out.push(iso(d));return out}function month(){return new Date().toISOString().slice(0,7)}let selected=month();function render(){let admin=S.role==='admin';N.innerHTML=(admin?['Dashboard','Programación','Operadores','Novedades','Cambios de turno','Historial','Reportes','Configuración']:['Programación']).map(t=>`<button onclick="go('${t}')">${t}</button>`).join('')+'<button onclick="api(\'/logout\',{}).then(load)">Salir</button>';if(!admin)tab='Programación';if(tab==='Programación'||tab==='Cambios de turno'){let d=S.draft;M.innerHTML=`<section><h3>${tab}</h3>${admin?`<div class="tools"><input type="date" id="start" value="${selected}-01"><input type="date" id="end" value="${selected}-28"><button id="generateBtn" onclick="generateDraft()" ${generating?'disabled':''}>${generating?'Generando programación…':'Generar borrador'}</button><span id="generateStatus" role="status" aria-live="polite">${generating?'Evaluando programación…':''}</span>${d?'<button onclick="act(\'publish\',{})">Publicar</button><button onclick="if(confirm(\'Eliminar borrador?\'))act(\'delete_draft\',{})">Eliminar borrador</button>':''}</div>`:''}<p>${d?'Borrador — no visible para operadores':'Programación publicada'}</p><input type="month" value="${selected}" onchange="selected=this.value;render()"> <span>T1 · T2 · T3 · DESC</span></section>`;if(d&&S.errors.length)M.innerHTML+=`<section class="bad"><b>${S.errors.length} incumplimientos</b><p>Revise cobertura, descansos o intercambie asignaciones antes de publicar.</p>${S.errors.slice(0,100).map(esc).join('<br>')}</section>`;let last=new Date(Date.UTC(+selected.slice(0,4),+selected.slice(5),0)).getUTCDate();M.innerHTML+=sheet(d?d.rows:S.published,dates(selected+'-01',selected+'-'+last),!!d&&admin);return}if(tab==='Operadores'){M.innerHTML='<section><h3>Operadores</h3>'+S.operators.map((o,i)=>`<p><input value="${esc(o.name)}" onchange="S.operators[${i}].name=this.value"><label>Grupo <input type="number" min="1" max="3" value="${o.group+1}" onchange="S.operators[${i}].group=+this.value-1"></label><label>Activo <input type="checkbox" ${o.active?'checked':''} onchange="S.operators[${i}].active=this.checked"></label></p>`).join('')+'<button onclick="S.operators.push({id:Math.max(0,...S.operators.map(o=>o.id))+1,name:\'Nuevo operador\',group:0,active:true});render()">Agregar</button> <button onclick="act(\'operators\',{items:S.operators})">Guardar</button></section>';return}if(tab==='Novedades'){M.innerHTML=`<section><h3>Novedades</h3><select id="op">${S.operators.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`)}</select><select id="type">${['VAC','INC','PER','LIC','CAP','AUS'].map(t=>`<option>${t}</option>`)}</select><input type="date" id="a"><input type="date" id="b"><input id="obs" placeholder="Observación opcional"><button onclick="addNov()">Agregar</button>${S.novelties.map((n,i)=>`<p>${esc(S.operators.find(o=>o.id===n.operator)?.name)} · ${esc(n.type)} · ${esc(n.start)} a ${esc(n.end)} <button onclick="if(confirm('Eliminar?')){S.novelties.splice(${i},1);act('novelties',{items:S.novelties})}">Eliminar</button></p>`).join('')}</section>`;return}if(tab==='Configuración'){M.innerHTML='<section><h3>Configuración</h3>'+Object.entries(S.config).filter(([k,v])=>typeof v==='number').map(([k,v])=>`<label>${esc(({coverage:'Cobertura',rest:'Descansos semanales',gap:'Horas mínimas entre turnos',maxrun:'Días consecutivos',alerts:'Anticipación de alertas'})[k])} <input type="number" min="1" value="${v}" onchange="S.config['${k}']=+this.value"></label>`).join('')+S.config.shifts.map((t,i)=>`<p>T${i+1} ${t.map((v,j)=>`<input type="time" value="${v}" onchange="S.config.shifts[${i}][${j}]=this.value">`).join(' ')}</p>`).join('')+'<button onclick="act(\'config\',S.config)">Guardar</button></section>';return}if(tab==='Historial'){M.innerHTML='<section><h3>Versiones publicadas</h3>'+S.versions.map((v,i)=>`<p>${esc(v.start)} – ${esc(v.end)} · ${esc(v.published_at)} <button onclick="showVersion(${i})">Consultar</button></p>`).join('')+'</section><div id="version"></div>';return}let rows=S.published;M.innerHTML=`<section><h3>${tab}</h3><p>Operadores activos: ${S.operators.filter(o=>o.active).length} · Versiones: ${S.versions.length}</p><input type="month" value="${selected}" onchange="selected=this.value;render()"></section>`;let ds=dates(selected+'-01',selected+'-'+new Date(Date.UTC(+selected.slice(0,4),+selected.slice(5),0)).getUTCDate());M.innerHTML+='<section><table><tr><th>Operador</th><th>T1</th><th>T2</th><th>T3</th><th>DESC</th><th>Horas</th><th>Domingos libres</th></tr>'+S.operators.map(o=>{let r=rows[o.id]||{},v=ds.map(d=>r[d]);let n=['T1','T2','T3','DESC'].map(t=>v.filter(x=>x===t).length);return `<tr><td>${esc(o.name)}</td>${n.map(x=>`<td>${x}</td>`).join('')}<td>${8.5*(n[0]+n[1]+n[2])}</td><td>${ds.filter(d=>new Date(d).getUTCDay()===0&&r[d]==='DESC').length}</td></tr>`}).join('')+'</table></section>'+sheet(rows,ds,false)}function showVersion(i){let v=S.versions[i];document.querySelector('#version').innerHTML=sheet(v.rows,dates(v.start,v.end),false)}function addNov(){if(!a.value||!b.value||a.value>b.value)return alert('Fechas inválidas');S.novelties.push({operator:+op.value,type:type.value,start:a.value,end:b.value,obs:obs.value});act('novelties',{items:S.novelties})}function sheet(rows,ds,edit){let h='<section class="scroll"><table><tr><th>Operador</th>';for(let d of ds){h+=`<th class="${new Date(d).getUTCDay()===0?'bad':''}">${d.slice(8)}<br>${['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][new Date(d).getUTCDay()]}</th>`;if(new Date(d).getUTCDay()===0)h+='<th>Horas</th>'}h+='</tr>';for(let o of S.operators){let r=rows[o.id]||{};h+=`<tr><td>${esc(o.name)} · G${o.group+1}</td>`;for(let d of ds){let t=r[d]||'';h+=`<td class="${esc(t)}" ${edit&&t?`onclick="cell(${o.id},'${d}','${t}')" style="cursor:pointer"`:''}>${esc(t||'—')}</td>`;if(new Date(d).getUTCDay()===0){let start=new Date(d);start.setUTCDate(start.getUTCDate()-6);let w=dates(iso(start),d).map(k=>r[k]);h+=`<td><b>${w.some(x=>!x)?'—':w.filter(x=>/^T[123]$/.test(x)).length*8.5}</b></td>`}}h+='</tr>'}for(let t of ['T1','T2','T3']){h+=`<tr><td>Cobertura ${t}</td>`;for(let d of ds){let n=Object.values(rows).filter(r=>r[d]===t).length;h+=`<td class="${n<S.config.coverage?'bad':'good'}">${n}</td>`;if(new Date(d).getUTCDay()===0)h+='<td></td>'}h+='</tr>'}return h+'</table></section>'}function cell(operator,date,old){let value=prompt('T1, T2, T3, DESC, VAC, INC, PER, LIC, CAP, AUS',old);if(value)act('edit',{operator,date,value:value.toUpperCase()})}load();</script></html>
